name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # dist/ 不入库，部署前按源码重新构建
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r examples _site/examples
          cp -r dist _site/dist
          # 根路径直接跳到示例页
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=examples/browser.html"><title>canalystii-ts</title><a href="examples/browser.html">Open the example</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
